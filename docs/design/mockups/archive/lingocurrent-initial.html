 function icons(){if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:15,height:15}});root.querySelectorAll('button').forEach(b=>b.classList.add('cursor-interaction'));}
 function notify(t){announce.textContent=t;}
 function saveState(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{screen:page,reviewMode:mode,style:'Compact modern workspace'},privateContent:{page,mode,readingSize:prefs.readingSize}}).catch(()=>{});}
 function status(s){return `<span class="lc-state ${s==='Due'?'due':s==='New'?'new':s==='Complete'?'complete':''}">${s}</span>`;}
 function heading(title,sub,actions=''){return `<div class="lc-heading"><div><h1>${title}</h1><p>${sub}</p></div>${actions}</div>`;}
 function setPlayer(){root.querySelector('#lc-player-toggle').innerHTML=`<i data-lucide="${playing?'pause':'play'}" aria-hidden="true"></i>`;root.querySelector('#lc-player-toggle').setAttribute('aria-label',playing?'Pause article':'Play article');icons();}
 function inspector(){const nested=stack.length>1;const word=nested?'adapt':readerWord.word;return `<aside class="lc-inspector" aria-label="Word explanation"><div class="lc-inspector-head"><span>${nested?'EXPLANATION / 2':'WORD EXPLANATION'}</span><button class="lc-flat" data-action="back-lookup" aria-label="${nested?'Back one explanation':'Close explanation'}">${nested?'Back':'Close'}<i data-lucide="${nested?'arrow-left':'x'}" aria-hidden="true"></i></button></div><div class="lc-inspector-body"><div><div class="lc-lemma"><h2>${word}</h2><span class="lc-pos">${nested?'verb':readerWord.pos}</span></div><p class="lc-meaning">${nested?'适应；使适合':readerWord.zh}</p><div class="lc-section-label">IN THIS CONTEXT</div><p class="lc-context">${nested?'改变以适应新的条件或环境。':'形容在受到影响或遇到变化后，仍能恢复并继续运作的能力。'}</p></div><div><div class="lc-section-label">EXAMPLE</div><p class="lc-example">${nested?'Communities can <mark>adapt</mark> to changing conditions.':exampleVersion?'A <mark>resilient</mark> community learns from each challenge.':'A <mark>resilient</mark> city can <span class="lc-inline-word" data-action="nest">adapt</span> to unexpected challenges.'}</p><div class="lc-actions"><button data-action="example-play"><i data-lucide="volume-2" aria-hidden="true"></i>Play</button><button data-action="refresh"><i data-lucide="refresh-cw" aria-hidden="true"></i>Refresh</button><button class="lc-primary" data-action="save-word"><i data-lucide="plus" aria-hidden="true"></i>${saved?'Add word':'Save word'}</button></div></div></div><div class="lc-inspector-foot">${nested?'From an example · Personal explanation':'From sentence 2 · Personal explanation'}</div></aside>`;}
 function reader(){return heading('Reading','Articles / Latest',`<button data-page="articles"><i data-lucide="arrow-left" aria-hidden="true"></i>All articles</button>`)+`<div class="lc-reader-grid"><article class="lc-reading"><div class="lc-article-head"><div class="lc-article-meta"><span class="lc-tag">SCIENCE & SOCIETY</span><span>Field Notes</span><span>·</span><span>Nov 15, 10:30 AM</span></div><h1>A quieter way to design a city</h1><p class="lc-article-sub">640 words · 4 min listening · Added to reading history</p><div class="lc-reading-tools"><button class="lc-primary" data-action="article-play"><i data-lucide="${playing?'pause':'play'}" aria-hidden="true"></i>${playing?'Pause article':'Play article'}</button><span class="lc-caption">Select a word to explore its meaning</span></div></div><div class="lc-transcript-header"><span>TRANSCRIPT</span><span>${playing?'Playing':'Ready'} · Sentence ${selectedSentence+1} of 6</span></div><div class="lc-paragraph">${sentence(0,'Cities are often measured by how quickly people can move through them.')}${sentence(1,'But a <span class="lc-word" data-action="lookup">resilient</span> neighborhood also gives people good reasons to slow down.')}${sentence(2,'A wider pavement, a shaded bench, or a quieter crossing can change the way a street is used.')}</div><div class="lc-paragraph">${sentence(3,'These changes may seem modest when considered on their own.')}${sentence(4,'In the long run, however, small improvements can support a more connected community.')}${sentence(5,'The challenge is to allocate space in ways that take everyday needs into account.')}</div><div class="lc-inspector-foot">Source: Field Notes · Collected Nov 15, 2026 · Science & society</div></article>${stack.length?inspector():`<aside class="lc-inspector"><div class="lc-inspector-body"><div><h3>Word explanation</h3><p class="lc-context">Select a word in the article to see its meaning and example.</p><button data-action="lookup">Look up resilient</button></div></div></aside>`}</div>`;}
 function sentence(i,text){return `<div class="lc-sentence ${selectedSentence===i?'is-active':''}"><button data-sentence="${i}" aria-label="Play sentence ${i+1}"><i data-lucide="${playing&&selectedSentence===i?'pause':'play'}" aria-hidden="true"></i></button><p>${text}</p></div>`;}
 function list(history=false){return heading(history?'Reading history':'Articles',history?'Articles you have opened, most recently visited first.':'Latest articles, ready to read and listen.',`<button class="lc-primary" data-action="play-all"><i data-lucide="list-music" aria-hidden="true"></i>Play all</button>`)+`<form class="lc-toolbar" id="lc-search-form"><div class="lc-search"><input id="lc-search" aria-label="Search article text" placeholder="Search article text"><button type="submit"><i data-lucide="search" aria-hidden="true"></i>Search</button></div><span class="lc-caption" id="lc-result-count">${history?'2 visited articles':'4 articles'} · Newest first</span></form><div class="lc-table-wrap"><table><thead><tr><th>Article</th><th>Category</th><th>Collected</th></tr></thead><tbody id="lc-article-rows">${articleRows(history?articles.slice(0,2):articles)}</tbody></table></div>`;}
 function articleRows(items){return items.map(a=>`<tr><td><button class="lc-table-action" data-page="reader">${a.title}</button><small>${a.excerpt}</small><small>${a.words} words · ${Math.round(a.words/160)} min listening</small></td><td><span class="lc-tag">${a.category}</span></td><td class="lc-muted">${a.time}</td></tr>`).join('')||'<tr><td colspan="3">No articles match your search.</td></tr>';}
 function modeCards(){return `<div class="lc-mode-grid">${[['speak','mic'],['spell','keyboard'],['translate','languages']].map(([m,icon],i)=>[m,icon,words.filter(w=>w.s[i]==='Due').length,words.filter(w=>w.s[i]==='New').length]).map(([m,icon,d,n])=>`<section class="lc-mode-card"><div><h2>${m[0].toUpperCase()+m.slice(1)}</h2><p><span style="color:var(--lc-amber)">${d} due</span> · ${n} new</p></div><button data-mode="${m}"><i data-lucide="${icon}" aria-hidden="true"></i>Start</button></section>`).join('')}</div>`;}
 function vocab(archive=false){const rows=archive?archivedWords:words.filter(w=>filter==='All'||filter==='Due'&&w.s.includes('Due')||filter==='New'&&w.s.includes('New'));return heading(archive?'Archive':'Vocabulary',archive?'Words completed in all three review modes.':'Your saved meanings, examples and independent review schedules.')+(archive?'':modeCards())+`<div class="lc-toolbar"><div class="lc-filter">${(archive?['Completed']:['All','Due','New']).map(f=>`<button data-filter="${f}" aria-pressed="${archive||f===filter}">${f}</button>`).join('')}</div><span class="lc-push lc-caption">${rows.length} words · ${archive?'All modes complete':'Earliest due first'}</span></div><div class="lc-table-wrap"><table><thead><tr><th>Word & meaning</th><th>Speak</th><th>Spell</th><th>Translate</th></tr></thead><tbody>${rows.map(w=>`<tr><td><button class="lc-table-action" data-word="${w.word}">${w.word}</button><small>${w.pos} · ${w.zh}</small></td>${w.s.map(s=>`<td>${status(s)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
 function detail(){const w=selectedArchive||words[activeWord];return heading(w.word,`${w.pos} · Saved meaning`, '<button data-page="vocabulary"><i data-lucide="arrow-left" aria-hidden="true"></i>Vocabulary</button>')+`<div class="lc-review-layout"><section class="lc-review-card"><div class="lc-section-label" style="margin-top:0">MEANING</div><p class="lc-review-meaning">${w.zh}</p><div class="lc-section-label">SAVED EXAMPLE</div><p class="lc-example">${savedExample(w)}</p><div class="lc-actions"><button data-action="example-play"><i data-lucide="volume-2" aria-hidden="true"></i>Play example</button><button data-action="refresh"><i data-lucide="refresh-cw" aria-hidden="true"></i>New example</button></div><div class="lc-section-label">REVIEW STATUS</div>${['Speak','Spell','Translate'].map((m,i)=>`<div class="lc-kv"><span>${m}</span>${status(w.s[i])}</div>`).join('')}<div class="lc-review-foot"><span class="lc-caption">Progress is retained when you change an example.</span><button class="lc-danger" data-action="delete"><i data-lucide="trash-2" aria-hidden="true"></i>Delete word</button></div></section><aside class="lc-review-side"><h3>Learning schedule</h3><div class="lc-kv"><span>Saved</span><span>Nov 12</span></div><div class="lc-kv"><span>Meaning</span><span>One saved sense</span></div><div class="lc-kv"><span>Review modes</span><span>3 independent</span></div><div class="lc-section-label">WAITING INTERVALS</div><p class="lc-context">1 · 2 · 4 · 7 · 15 · 30 days</p><div class="lc-section-label">AFTER AN INCORRECT ANSWER</div><p class="lc-context">Practice again in 10 minutes. Your completed round stays the same.</p></aside></div>`;}
 function savedExample(w){const examples={resilient:exampleVersion?'A <mark>resilient</mark> community learns from each challenge.':'A <mark>resilient</mark> city can adapt to unexpected challenges.',allocate:'We need to <mark>allocate</mark> more space for pedestrians.','in the long run':'Small improvements matter <mark>in the long run</mark>.',sustain:'These changes can <mark>sustain</mark> a healthier community.',underlying:'The <mark>underlying</mark> problem needs careful study.',gradually:'The neighborhood <mark>gradually</mark> became quieter.','take into account':'We must <mark>take into account</mark> the needs of residents.',perspective:'This offers a different <mark>perspective</mark> on city life.',consistent:'The results have been <mark>consistent</mark> over time.'};return examples[w.word]||w.word;}
 function review(){const isNew=reviewFilter==='New';const target=isNew?'in the long run':'resilient';const round=isNew?0:2;const nextRound=isNew?1:3;const nextDays=isNew?1:4;const pos=isNew?'phrase':'adjective';const m=mode[0].toUpperCase()+mode.slice(1);const translated=mode==='translate';return heading(`${m} review`,'One meaning at a time. Progress is saved separately for each mode.','<button data-page="vocabulary"><i data-lucide="arrow-left" aria-hidden="true"></i>Leave review</button>')+`<div class="lc-toolbar"><div class="lc-filter">${['All','Due','New'].map(f=>`<button data-review-filter="${f}" aria-pressed="${f===reviewFilter}">${f}</button>`).join('')}</div><span class="lc-push lc-caption">${reviewFilter==='New'?'New word':'Due now'} · 1 of ${reviewFilter==='All'?'4':'2'}</span></div><div class="lc-review-layout"><section class="lc-review-card"><div class="lc-review-meta"><span>${m.toUpperCase()} · ${translated?'CHOOSE A MEANING':'ANSWER WITH THE BASE FORM'}</span>${status(reviewFilter==='New'?'New':'Due')}</div><span class="lc-pos">${pos}</span><p class="lc-review-meaning">${translated?target:(isNew?'从长远来看':'有适应力的；能迅速恢复的')}</p>${translated?`<div class="lc-options">${(isNew?['暂时地','从长远来看','与此同时','立即']:['持久的；持续很久的','有适应力的；能迅速恢复的','准确的；精确的','脆弱的；易受损的']).map((o,i)=>`<button data-option="${i}" aria-pressed="${selectedOption===i}"><span class="lc-option-key">${String.fromCharCode(65+i)}</span><span>${isNew?'phrase':'adj.'} ${o}</span></button>`).join('')}</div>`:`<p class="lc-cloze">${isNew?'The benefits become clear':'A'} <span class="lc-gap" role="img" aria-label="Hidden target"></span>${isNew?'.':' city can adapt to unexpected challenges.'}</p>${mode==='spell'?'<label class="lc-answer-label" for="lc-answer">Your answer</label><input id="lc-answer" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Enter the base form">':'<button class="lc-primary" data-action="record"><i data-lucide="mic" aria-hidden="true"></i>Record answer</button><p class="lc-caption" style="margin-top:9px">Say the English word or phrase.</p>'}`}${result?`<div class="lc-feedback ${result==='technical'?'error':''}" aria-live="polite">${result==='correct'?`<strong>Correct · Saved</strong><br>Next review in ${nextDays} ${nextDays===1?'day':'days'}.`:result==='incorrect'?`<strong>Correct answer: ${target}</strong><br>Try again in 10 minutes. Completed round stays at ${round}.`:'Microphone preview only. No recording was made and no result was saved.'}</div>`:''}<div class="lc-review-foot"><span class="lc-caption">${mode==='speak'?'Technical errors do not count as wrong.':translated?'Choose one option, then submit.':'Other visible words remain available for lookup.'}</span>${mode!=='speak'?`<button class="lc-primary" data-action="${result?'next':'submit'}">${result?'Next word':'Submit answer'}<i data-lucide="arrow-right" aria-hidden="true"></i></button>`:''}</div></section><aside class="lc-review-side"><h3>This mode</h3><div class="lc-kv"><span>Completed rounds</span><strong>${result==='correct'?nextRound:round}</strong></div><div class="lc-kv"><span>Current interval</span><span>${isNew&&!result?'Not started':(result==='correct'?nextDays:2)+' days'}</span></div><div class="lc-kv"><span>Review type</span><span>${reviewFilter==='New'?'New':'Scheduled'}</span></div><div class="lc-section-label">INTERVAL PROGRESS</div><div class="lc-steps">${[0,1,2,3,4,5,6].map(i=>`<span class="lc-step ${i<(result==='correct'?nextRound:round)?'done':''}"></span>`).join('')}</div><p class="lc-caption">1 · 2 · 4 · 7 · 15 · 30 days</p><div class="lc-section-label">OTHER MODES</div><div class="lc-kv"><span>${mode==='speak'?'Spell':'Speak'}</span>${status('Due')}</div><div class="lc-kv"><span>${mode==='translate'?'Spell':'Translate'}</span>${status('In 2 days')}</div><p class="lc-caption" style="margin-top:14px">This answer only changes ${m.toLowerCase()} progress.</p></aside></div>`;}
 function render(){content.innerHTML=page==='reader'?reader():page==='articles'?list():page==='history'?list(true):page==='vocabulary'?vocab():page==='archive'?vocab(true):page==='detail'?detail():review();crumb.textContent=page==='reader'?'Articles / Reading':page==='detail'?'Vocabulary / Word details':page==='review'?`Vocabulary / ${mode[0].toUpperCase()+mode.slice(1)} review`:page[0].toUpperCase()+page.slice(1);root.querySelectorAll('nav button').forEach(b=>{if(b.dataset.page===page||b.dataset.page==='articles'&&page==='reader'||b.dataset.page==='vocabulary'&&['detail','review'].includes(page))b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});root.style.setProperty('--lc-reading-size',prefs.readingSize+'px');const counts=root.querySelectorAll('nav .lc-count');counts[0].textContent=words.length;counts[1].textContent=archivedWords.length;root.querySelectorAll('.lc-mode-links span').forEach((el,i)=>el.textContent=words.filter(w=>w.s[i]==='Due').length+' due');icons();}
 function confirmAction(kind){const del=kind==='delete';root.querySelector('#lc-confirm-title').textContent=del?'Delete word?':'Replace saved word?';root.querySelector('#lc-confirm-text').textContent=del?'This deletes this word and all three review records. Saved explanations stay available.':'Replace the saved meaning and example with this explanation? Your Speak, Spell and Translate progress will stay the same.';root.querySelector('#lc-confirm-action').textContent=del?'Delete word':'Replace';dialog.dataset.kind=kind;dialog.showModal();}
 root.addEventListener('click',e=>{const p=e.target.closest('[data-page]');if(p){page=p.dataset.page;result=null;notify('');render();saveState();return;}const m=e.target.closest('[data-mode]');if(m){mode=m.dataset.mode;page='review';result=null;selectedOption=null;render();saveState();return;}const f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;render();return;}const rf=e.target.closest('[data-review-filter]');if(rf){reviewFilter=rf.dataset.reviewFilter;result=null;render();return;}const w=e.target.closest('[data-word]');if(w){const i=words.findIndex(x=>x.word===w.dataset.word);if(i>=0){selectedArchive=null;activeWord=i;page='detail';render();saveState();}else{selectedArchive=archivedWords.find(x=>x.word===w.dataset.word);page='detail';render();saveState();}return;}const option=e.target.closest('[data-option]');if(option){selectedOption=Number(option.dataset.option);render();return;}const sentenceButton=e.target.closest('[data-sentence]');if(sentenceButton){const n=Number(sentenceButton.dataset.sentence);if(selectedSentence===n){selectedSentence=-1;playing=false;}else{selectedSentence=n;playing=true;}render();setPlayer();notify(playing?'Sentence selected. Audio is not connected in this design preview.':'Sentence cleared.');return;}const a=e.target.closest('[data-action]')?.dataset.action;if(!a)return;
  if(a==='lookup'){stack=['resilient'];activeWord=0;render();}
  if(a==='nest'){stack.push('adapt');render();}
  if(a==='detail-lookup'){activeWord=0;page='reader';stack=['resilient','adapt'];render();}
  if(a==='back-lookup'){stack.pop();render();}
  if(a==='refresh'){exampleVersion=1-exampleVersion;render();notify('Example changed in preview. Review progress is unchanged.');}
  if(a==='save-word'){if(saved)confirmAction('replace');else{saved=true;notify('Word saved in preview.');render();}}
  if(a==='delete')confirmAction('delete');
  if(a==='example-play'){playing=false;setPlayer();notify('Example selected. Article position retained; resume manually. Audio is not connected.');}
  if(a==='article-play'){playing=!playing;if(selectedSentence<0)selectedSentence=0;render();setPlayer();notify('Playback controls preview only; no audio is connected.');}
  if(a==='play-all'){page='reader';playing=true;selectedSentence=0;render();setPlayer();notify('Fixed queue preview: all matching articles at start. No audio is connected.');}
  if(a==='record'){result='technical';render();}
  if(a==='submit'){if(mode==='translate'&&selectedOption===null){notify('Choose an option first.');return;}const answer=root.querySelector('#lc-answer')?.value||'';if(mode==='spell'&&!answer.trim()){notify('Enter your answer first.');return;}result=mode==='translate'?(selectedOption===1?'correct':'incorrect'):(answer.trim().replace(/\s+/g,' ').toLowerCase()===(reviewFilter==='New'?'in the long run':'resilient')?'correct':'incorrect');render();notify('Sample answer evaluated locally. No learning record is saved.');}
  if(a==='next'){result=null;selectedOption=null;render();notify('Next sample question.');}
 });
 root.addEventListener('submit',e=>{e.preventDefault();const input=root.querySelector('#lc-search');if(!input)return;const q=input.value.toLowerCase().trim();const scope=page==='history'?articles.slice(0,2):articles;const matches=scope.filter(a=>(a.title+' '+a.excerpt).toLowerCase().includes(q));root.querySelector('#lc-article-rows').innerHTML=articleRows(matches);root.querySelector('#lc-result-count').textContent=`${matches.length} articles · Newest first`;icons();notify('Sample content search. Production search will cover article body text.');});
 root.querySelector('#lc-cancel').addEventListener('click',()=>dialog.close());
 root.querySelector('#lc-confirm-action').addEventListener('click',()=>{const del=dialog.dataset.kind==='delete';dialog.close();if(del){if(selectedArchive){archivedWords.splice(archivedWords.indexOf(selectedArchive),1);selectedArchive=null;page='archive';}else{page='vocabulary';saved=false;words.splice(activeWord,1);activeWord=0;}}else saved=true;render();notify(del?'Word removed from the preview. Independent explanations are retained.':'Saved example replaced in preview. All three review schedules are unchanged.');});
 root.querySelector('#lc-player-toggle').addEventListener('click',()=>{playing=!playing;setPlayer();notify('Playback controls preview only; no audio is connected.');});
 root.querySelector('#lc-seek').addEventListener('input',e=>{const sec=Number(e.target.value);root.querySelector('#lc-time').textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');});
 root.addEventListener('keydown',e=>{if(e.key==='Escape'&&!dialog.open&&page==='reader'&&stack.length){stack.pop();render();}});
 const restored=window.openai?.widgetState?.privateContent;if(restored){if(['reader','articles','history','vocabulary','archive','detail','review'].includes(restored.page))page=restored.page;if(['speak','spell','translate'].includes(restored.mode))mode=restored.mode;if(Number.isFinite(restored.readingSize))prefs.readingSize=Math.min(19,Math.max(14,restored.readingSize));}
 window.addEventListener('openai:set_globals',e=>{const st=e.detail?.globals?.widgetState?.privateContent;if(st&&Number.isFinite(st.readingSize)){prefs.readingSize=Math.min(19,Math.max(14,st.readingSize));render();}});
 render();
 if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSlider(prefs,'readingSize',{label:'Reading text size',min:14,max:19,unit:'px',reference:'reading.text-size'});}
})();
</script>
