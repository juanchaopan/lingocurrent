  canvas.addEventListener('keydown',e=>{if(e.key==='Escape'&&s.page==='vocabulary'&&(s.selectMode||s.selectedIds.length)&&!canvas.querySelector('dialog').open&&!s.popover&&!s.accountOpen){clearWordSelection();render();focusVisible(s.layout==='desktop'?'[data-select-visible]':'[data-action=selection-mode]');}});
  canvas.addEventListener('cancel',()=>{s.deleteIds=[];queueMicrotask(()=>focusVisible(s.deleteFocus||'[data-action=selection-mode]'));},true);
  function cancelGesture(){if(s.gesture?.holdTimer)clearTimeout(s.gesture.holdTimer);s.gesture=null;}
  canvas.addEventListener('pointerdown',e=>{if(s.page!=='vocabulary'||s.layout==='desktop'||!['touch','pen'].includes(e.pointerType)||s.selectMode)return;const card=e.target.closest('[data-vocab-card]');if(!card||e.target.closest('[data-delete-id],input,label'))return;cancelGesture();const id=Number(card.dataset.vocabCard),g={id,pointerId:e.pointerId,x:e.clientX,y:e.clientY,card,front:card.querySelector('.card-front'),direction:null,base:s.swipeId===id?-80:0};s.gesture=g;g.holdTimer=setTimeout(()=>{if(s.gesture!==g||g.direction)return;s.selectMode=true;s.selectedIds=[id];s.swipeId=null;s.suppressClickUntil=Date.now()+600;cancelGesture();render();notify('1 word selected.');focusVisible('.cards [data-select-word="'+id+'"]');},500);});
  canvas.addEventListener('pointermove',e=>{const g=s.gesture;if(!g||e.pointerId!==g.pointerId)return;const dx=e.clientX-g.x,dy=e.clientY-g.y;if(Math.abs(dx)>10||Math.abs(dy)>10){clearTimeout(g.holdTimer);if(!g.direction)g.direction=Math.abs(dx)>Math.abs(dy)*1.3?'horizontal':'vertical';}if(g.direction==='horizontal'){const x=Math.max(-80,Math.min(0,g.base+dx));if(g.front){g.front.style.transition='none';g.front.style.transform='translateX('+x+'px)';}g.card.setPointerCapture?.(e.pointerId);s.suppressClickUntil=Date.now()+600;}},{passive:true});
  canvas.addEventListener('pointerup',e=>{const g=s.gesture;if(!g||e.pointerId!==g.pointerId)return;clearTimeout(g.holdTimer);if(g.direction==='horizontal'){s.swipeId=g.base+(e.clientX-g.x)<-35?g.id:null;s.suppressClickUntil=Date.now()+400;cancelGesture();render();}else{if(g.direction==='vertical')s.suppressClickUntil=Date.now()+350;cancelGesture();}});
  canvas.addEventListener('pointercancel',()=>{const g=s.gesture;if(g)s.suppressClickUntil=Date.now()+350;cancelGesture();if(g?.direction==='horizontal')render();});
  canvas.addEventListener('contextmenu',e=>{if(s.layout!=='desktop'&&e.target.closest('[data-vocab-card]'))e.preventDefault();});

  function exampleRecord(context,layer=0){s.examplePositions??={detail:0,review:0};const w=context==='lookup'?s.layers[layer]:context==='detail'?(s.selected||words[0]):{word:'resilient',examples:reviewExamples};const rows=examplesOf(w);const index=Math.min(rows.length-1,context==='lookup'?(w.displayExampleIndex||0):(s.examplePositions[context]||0));return {w,rows,index};}
  function maskedExample(text,word){let out='',start=0,at=0;while((at=text.toLowerCase().indexOf(word.toLowerCase(),start))!==-1){out+='<span class="selectable">'+wordMarkup(text.slice(start,at))+'</span><span class="gap" role="img" aria-label="Hidden target"></span>';start=at+word.length;}return out+'<span class="selectable">'+wordMarkup(text.slice(start))+'</span>';}
  function examplePanel(context,layer=0){const {w,rows,index}=exampleRecord(context,layer),reviewing=context==='review',selectContext=context==='lookup'?'example':context;const previous='<button class="icon flat example-arrow example-prev" data-action="example-prev" data-example-context="'+context+'" data-example-layer="'+layer+'" aria-label="Previous example" '+(index===0?'disabled':'')+'>'+icon('chevron-left')+'</button>';const next='<button class="icon flat example-arrow example-next" data-action="example-next" data-example-context="'+context+'" data-example-layer="'+layer+'" aria-label="Next example" '+(index===rows.length-1?'disabled':'')+'>'+icon('chevron-right')+'</button>';return `<section class="example-carousel" data-example-context="${context}" data-example-layer="${layer}" role="group" aria-label="Examples"><div class="example-actions"><span class="small muted">Example</span><div class="example-controls">${selectionButton(selectContext)}${reviewing?'':`<button class="icon" data-action="${context==='lookup'?'play-example':'detail-example'}" aria-label="Play example">${icon('volume-2')}</button><button class="icon" data-action="refresh-visible-example" data-example-context="${context}" data-example-layer="${layer}" aria-label="Refresh this example">${icon('refresh-cw')}</button>`}</div></div><div class="example-track">${previous}<p class="${reviewing?'cloze':'example selectable'}" data-select-scope="${reviewing?'review':'example'}">${reviewing&&s.mode!=='Translate'?maskedExample(rows[index],w.word):wordMarkup(rows[index],w.word)}</p>${next}</div><span class="example-count" role="status" aria-live="polite">${index+1} / ${rows.length}</span></section>`;}
  function floatHTML(w,n,back){return `<section class="float ${back?'back-layer':''}" style="${back?'transform:translateX('+(-8*(s.layers.length-n-1))+'px);min-height:'+(200+((n%2)*40))+'px;z-index:'+n:''}" aria-label="Explanation of ${esc(w.word)}" ${back?'inert':''}><header class="float-head"><span>Word explanation</span><button class="icon flat" data-action="add-word" aria-label="Add word">${icon('plus')}</button><button class="icon flat" data-action="close-lookup" aria-label="Close this explanation">${icon('x')}</button></header><div class="float-body"><div class="lemma-row"><h2>${esc(w.word)}</h2><button class="icon flat" data-action="play-word" aria-label="Play word">${icon('volume-2')}</button></div><p class="pos">${esc(w.pos)}</p><p class="meaning">${esc(w.zh)}</p>${examplePanel('lookup',n)}</div></section>`;}
  function openLookup(t){if(s.page==='review'&&s.mode!=='Translate'&&t.toLowerCase().includes('resilient'))return;t=t.trim().replace(/^[\s.,;:!?]+|[\s.,;:!?]+$/g,'');if(!t||t.length>160)return;const w=getExplanation(t);s.layers.push({...w,examples:[...examplesOf(w)],displayExampleIndex:0});s.lastSelected=t;updateFloats();notify('');}
  function selectionSegments(){if(s.selectionTool==='article')return activeArticle().body;if(s.selectionTool==='example'){const w=s.layers.at(-1);return [w?examplesOf(w)[w.displayExampleIndex||0]:''];}if(s.selectionTool==='detail'){const {rows,index}=exampleRecord('detail');return [rows[index]];}const text=reviewExamples[s.examplePositions?.review||0];return s.mode==='Translate'?[text]:text.split(/resilient/gi).filter(t=>t.trim());}
  function detail(){const w=s.selected||words[0];return `<div class="detail-controls"><button class="icon flat" data-action="close-detail" aria-label="Close word and return to Vocabulary" data-tooltip="Close word">${icon('x')}</button></div><div class="reader"><div class="reader-head"><div class="lemma-row"><h2>${esc(w.word)}</h2><button class="icon" data-action="detail-word" aria-label="Play word">${icon('volume-2')}</button></div><p class="pos">${esc(w.pos)}</p><p class="meaning">${esc(w.zh)}</p></div><div style="padding:16px">${examplePanel('detail')}${progressGroups(w)}</div><div class="float-host" style="bottom:16px"></div></div>`;}
  function review(){return `<section class="review"><div class="review-controls"><span>${s.mode}</span><button class="review-close icon flat" data-action="close-review" aria-label="Close review and return to Vocabulary" data-tooltip="Close review">${icon('x')}</button></div><div class="float-host" style="bottom:62px"></div><div class="prompt"><div class="target" ${s.mode==='Translate'?'lang="en"':''}>${s.mode==='Translate'?'resilient':'有适应力的；能迅速恢复的'}</div><p class="pos">adjective</p>${examplePanel('review')}${s.mode==='Translate'?`<div class="option-list">${['持久的；持续很久的','有适应力的；能迅速恢复的','准确的；精确的','脆弱的；易受损的'].map((o,i)=>`<button data-option="${i}" aria-pressed="${s.option===i}" ${s.feedback&&s.feedback!=='technical'?'disabled':''}><span>${esc(o)}<small>adjective</small></span></button>`).join('')}</div>`:s.mode==='Spell'?`<label class="small muted">Your answer<input class="answer" autocomplete="off" autocorrect="off" spellcheck="false" data-answer ${s.feedback&&s.feedback!=='technical'?'disabled':''} value="${esc(s.answerText||'')}"></label>`:`<button class="primary" data-action="record" ${s.feedback&&s.feedback!=='technical'?'disabled':''}>${icon('mic')}Record</button>`}${s.feedback?`<div class="feedback" role="status">${s.feedback==='correct'?'Correct · Next review in 4 days':s.feedback==='incorrect'?'resilient · Try again in 10 mins':'Recording is not connected in this preview.'}</div>`:''}</div><div class="submit-row"><span class="review-counter">Round 3</span>${s.mode==='Speak'&&(!s.feedback||s.feedback==='technical')?'':`<button class="primary" data-action="${s.feedback?'next-question':'submit-answer'}">${s.feedback?'Next':'Submit'}${icon('arrow-right')}</button>`}</div></section>`;}
  function moveExample(context,layer,delta){const {w,rows,index}=exampleRecord(context,layer),next=Math.max(0,Math.min(rows.length-1,index+delta));if(next===index||s.recording)return;const answer=canvas.querySelector('[data-answer]');if(answer)s.answerText=answer.value;if(context==='lookup')w.displayExampleIndex=next;else s.examplePositions[context]=next;s.selectionTool=null;if(context==='lookup')updateFloats();else render();const action=next===0?'example-next':next===rows.length-1?'example-prev':delta>0?'example-next':'example-prev';focusVisible('[data-action="'+action+'"][data-example-context="'+context+'"]:not(:disabled)',true);notify('Example '+(next+1)+' of '+rows.length);}
  canvas.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset,context=d.exampleContext,layer=Number(d.exampleLayer||0);if(d.action==='example-prev'||d.action==='example-next'){moveExample(context,layer,d.action==='example-next'?1:-1);return;}if(d.action==='refresh-visible-example'){const {w,rows,index}=exampleRecord(context,layer);w.examples=[...rows];w.examples[index]=rows[index].startsWith('In this')?getExplanation(w.word).example:'In this situation, '+w.word+' is a useful expression.';w.example=w.examples[0];if(context==='lookup')updateFloats();else render();notify('Only this sample example changed; no AI call was made.');return;}if((d.action==='add-word'&&!canvas.querySelector('dialog').open)||(d.action==='confirm-delete'&&canvas.querySelector('dialog').dataset.kind==='replace')){const w=s.layers.at(-1),saved=w&&words.find(x=>x.word===w.word);if(saved){saved.examples=[...examplesOf(w)];saved.example=saved.examples[0];delete saved.displayExampleIndex;}}});
  canvas.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight'].includes(e.key)||e.target.closest('input,textarea,select'))return;const panel=e.target.closest('.example-carousel');if(!panel||window.getSelection?.().toString().trim())return;e.preventDefault();moveExample(panel.dataset.exampleContext,Number(panel.dataset.exampleLayer||0),e.key==='ArrowRight'?1:-1);});
  canvas.addEventListener('pointerdown',e=>{if(s.layout==='desktop'||!['touch','pen'].includes(e.pointerType)||e.target.closest('button,input,select'))return;const panel=e.target.closest('.example-carousel');if(!panel)return;s.exampleGesture={pointerId:e.pointerId,x:e.clientX,y:e.clientY,context:panel.dataset.exampleContext,layer:Number(panel.dataset.exampleLayer||0),moved:false};});
  canvas.addEventListener('pointermove',e=>{const g=s.exampleGesture;if(!g||g.pointerId!==e.pointerId)return;if(Math.abs(e.clientX-g.x)>10||Math.abs(e.clientY-g.y)>10)g.moved=true;},{passive:true});
  canvas.addEventListener('pointerup',e=>{const g=s.exampleGesture;if(!g||g.pointerId!==e.pointerId)return;s.exampleGesture=null;const dx=e.clientX-g.x,dy=e.clientY-g.y;if(!g.moved)return;s.suppressExampleLookupUntil=Date.now()+400;if(Math.abs(dx)>=45&&Math.abs(dx)>Math.abs(dy)*1.3&&!window.getSelection?.().toString().trim()){moveExample(g.context,g.layer,dx<0?1:-1);}});
  canvas.addEventListener('pointercancel',()=>{s.exampleGesture=null;s.suppressExampleLookupUntil=Date.now()+350;});
  function renderOverlay(){const host=canvas.querySelector('.overlay-host');if(!host)return;host.innerHTML=overlay();renderIcons(canvas);positionOverlay();}
  window.addEventListener('resize',positionOverlay);
  if(globalThis.ResizeObserver)new ResizeObserver(positionOverlay).observe(canvas);
  s.rerender=render;
  canvas.addEventListener('click',()=>queueMicrotask(()=>save(s)));
  canvas.addEventListener('change',()=>save(s));
  canvas.addEventListener('submit',()=>save(s));
  render();
 });
 const restored=window.openai?.widgetState?.privateContent;
 function applySaved(st){if(st?.version!==7)return;allStates.forEach(s=>{if(['articles','vocabulary','reader','review'].includes(st.page))s.page=st.page;if(modes.includes(st.mode))s.mode=st.mode;s.scope='All';s.sort=s.page==='vocabulary'?'word':'collected';s.dir=s.sort==='word'?1:-1;s.rerender();});}
 applySaved(restored);
 window.addEventListener('openai:set_globals',e=>applySaved(e.detail?.globals?.widgetState?.privateContent));
})();
</script>
