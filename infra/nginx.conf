upstream web {
  server app:3000;
}
server {
  listen 80;
  server_name _;
  location / {
    proxy_pass http://web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    add_header X-Local-Upstream $upstream_addr always;
  }
}
