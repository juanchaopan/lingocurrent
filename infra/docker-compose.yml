name: lingocurrent
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    deploy:
      replicas: 2
    environment:
      DATABASE_URL: postgresql://lingocurrent:${POSTGRES_PASSWORD:-local-only}@db:5432/lingocurrent
      S3_ENDPOINT: http://storage:9090
      S3_REGION: us-east-1
      S3_BUCKET: lingocurrent-local
      S3_ACCESS_KEY_ID: local-s3
      S3_SECRET_ACCESS_KEY: local-s3-secret
      AI_BASE_URL: http://ai-stub:8080
      SCHEDULE_ENABLED: 'false'
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
      ai-stub:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
  proxy:
    image: nginx:1.28-alpine
    ports:
      - '127.0.0.1:${APP_PORT:-3000}:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/api/health']
      interval: 15s
      timeout: 5s
      retries: 5
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lingocurrent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only}
      POSTGRES_DB: lingocurrent
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lingocurrent -d lingocurrent']
      interval: 5s
      timeout: 5s
      retries: 10
  storage:
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: 'true'
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: lingocurrent-local
    ports:
      - '127.0.0.1:9000:9090'
    volumes:
      - object-data:/s3mockroot
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:9090/favicon.ico']
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 20
  ai-stub:
    image: node:24.22.1-alpine
    user: node
    working_dir: /stub
    command: ['node', 'server.mjs']
    volumes:
      - ./ai-stub.mjs:/stub/server.mjs:ro
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  postgres-data:
  object-data:
