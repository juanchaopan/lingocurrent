name: workspace-admin
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        default: staging
        required: true
      operation:
        type: choice
        options: [seed-fixture, channels-preview, channels-apply, grant, revoke]
        required: true
      clerk_user_id:
        description: Clerk user ID for grant/revoke (never an email or token)
        type: string
      manifest:
        description: Reviewed JSON file under fixtures/
        type: string
        default: fixtures/channels.json
permissions:
  contents: read
concurrency:
  group: workspace-admin-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  operate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
      S3_REGION: ${{ vars.S3_REGION }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      WORKSPACE_ENV: ${{ inputs.environment }}
      OPERATION: ${{ inputs.operation }}
      CLERK_USER_ID: ${{ inputs.clerk_user_id }}
      MANIFEST: ${{ inputs.manifest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/run-workspace-admin.mjs
