name: ci
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.65.1-noble
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      STORYBOOK_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm arch
      - run: pnpm typecheck
      - run: pnpm test
      - run: node --test spikes/r2/*.test.mjs
      - run: pnpm build
      - run: pnpm build-storybook
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-evidence
          path: |
            test-results/
            playwright-report/
  local-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: docker compose -f infra/docker-compose.yml config --quiet
      - run: docker compose -f infra/docker-compose.yml up --build -d --wait --wait-timeout 180
      - run: node scripts/check-local-stack.mjs
      - if: failure()
        run: docker compose -f infra/docker-compose.yml logs --no-color
      - if: always()
        run: docker compose -f infra/docker-compose.yml down --volumes
  duplication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm duplication
  r2-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install Flask==3.1.3 cryptography==50.0.2
      - run: python -m unittest discover -s spikes/r2/cloud -p test_auth.py -v
      - run: python -m unittest discover -s spikes/r2 -p test_local_lab.py -v
      - run: python -m py_compile spikes/r2/prepare_cloud.py spikes/r2/cloud/app.py
  ci:
    if: always()
    needs: [app, duplication, local-stack, r2-boundary]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: test "$RESULTS" = "success,success,success,success"
