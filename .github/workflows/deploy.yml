# EXPERIMENT BRANCH ONLY. Never merge this replacement into main.
# Reuses the registered workflow path so branch-only code can be dispatched.
name: r2-spike-do-not-merge
on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact owner-reviewed spike head approved to receive testing credentials
        required: true
        type: string
      engine:
        description: One isolated engine deployment (OpenAI makes six paid demo calls)
        required: true
        type: choice
        options: [vosk-lgraph, vosk-small, kokoro, openai]
      operation:
        description: Run a probe, or remove one matching retained deployment
        required: true
        default: run
        type: choice
        options: [run, cleanup]
      keep_deployment:
        description: Keep the signed probe temporarily for private owner-corpus requests
        default: false
        type: boolean
      cleanup_url:
        description: Exact retained probe URL, used only for cleanup
        required: false
        type: string
permissions:
  contents: read
  checks: read
concurrency:
  group: r2-spike
  cancel-in-progress: false
jobs:
  validate:
    if: >-
      github.ref == 'refs/heads/codex/spike-7-validation' &&
      github.actor == github.repository_owner && github.sha == inputs.approved_sha
    runs-on: ubuntu-latest
    steps:
      - name: Require successful CI on the exact head
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/codex/spike-7-validation" --jq '.object.sha')
          test "$current" = "$APPROVED_SHA"
          result=$(gh api "repos/$GITHUB_REPOSITORY/commits/$APPROVED_SHA/check-runs" --jq '[.check_runs[] | select(.name == "ci")] | sort_by(.started_at) | last | .conclusion')
          test "$result" = success
  measure:
    needs: validate
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 25
    env:
      PROBE_ENGINE: ${{ inputs.engine }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.approved_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Prepare one model without cloud credentials
        if: inputs.operation == 'run'
        env:
          ENGINE: ${{ inputs.engine }}
        run: |
          python spikes/r2/prepare_cloud.py "$ENGINE"
          python -m pip install -r spikes/r2/cloud/requirements.txt
          python -m unittest discover -s spikes/r2/cloud -p test_auth.py
          node --check spikes/r2/runner.mjs
          node --check spikes/r2/deploy_probe.mjs
          node spikes/r2/runner.mjs init
          python -m pip freeze > .ai-review-context/r2-output/installed-packages.txt
          cp spikes/r2/evidence/*-preparation.json .ai-review-context/r2-output/
      - name: Build and deploy an isolated nonproduction probe
        if: inputs.operation == 'run'
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          OPENAI_API_KEY: ${{ inputs.engine == 'openai' && secrets.OPENAI_API_KEY || '' }}
        run: node spikes/r2/deploy_probe.mjs
      - name: Collect synthetic smoke or original-text demos
        if: inputs.operation == 'run'
        env:
          PROBE_URL: ${{ steps.deploy.outputs.url }}
          ENGINE: ${{ inputs.engine }}
        run: node spikes/r2/runner.mjs smoke "$PROBE_URL" "$ENGINE"
      - name: Remove only this probe deployment
        if: >-
          always() && (inputs.operation == 'cleanup' ||
          (steps.deploy.outcome != 'skipped' &&
          (!inputs.keep_deployment || failure())))
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          PROBE_CLEANUP_URL: ${{ inputs.operation == 'cleanup' && inputs.cleanup_url || '' }}
        run: node spikes/r2/deploy_probe.mjs cleanup
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r2-${{ inputs.engine }}-${{ github.run_id }}
          path: .ai-review-context/r2-output/
          if-no-files-found: warn
          retention-days: 7
